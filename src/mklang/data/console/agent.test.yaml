# Scenario tests for agent.mkl — run with:
#   mklang test agent.mkl --script agent.test.yaml
#
# decide's judge batch is the ten action conditions [DISCOVER=0, RUN=1,
# CLARIFY=2, AUTHOR=3, REPLY=4, WORKSPACE_SCAN=5, WORKSPACE_SEARCH=6,
# WORKSPACE_READ=7, WORKSPACE_ANALYZE=8, TASK_UPDATE=9] (`otherwise` never
# enters a batch); action states have a single otherwise gate and are never
# judged. Tools are scripted, so every flow is deterministic and key-free.
#
# Since decide carries its own action payload (parse: json), one decision is
# ONE produce — there is no prose→JSON state between decide and its tool, and
# every produced decision must be a valid JSON object or the state halts (the
# `malformed-decision-halts` scenario pins that). Map-form produce keys on
# per-state prompt tokens ("single next action" = decide, "final reply" =
# reply); the authoring flows use LIST-form produce because decide is visited
# multiple times with different intended outputs.

scenarios:
  # Workspace analysis: scan → search → read → evidence synthesis → reply.
  - name: workspace-analysis
    llm:
      produce:
        - '{"say": "Inspecting the project root.", "action": "WORKSPACE_SCAN", "detail": {"path": ""}}'
        - '{"say": "Looking for the architecture entrypoint.", "action": "WORKSPACE_SEARCH", "detail": {"query": "architecture", "max_results": 10}}'
        - '{"say": "Reading the architecture doc.", "action": "WORKSPACE_READ", "detail": {"path": "docs/reference/architecture.md", "max_bytes": 120000}}'
        - '{"say": "Synthesizing the observed files.", "action": "WORKSPACE_ANALYZE", "detail": {}}'
        - "FACTS: docs/reference/architecture.md describes the interpreter. INFERENCES: the engine is the core. LIMITS: only selected files were read."
        - '{"say": "The evidence is enough to answer.", "action": "REPLY", "detail": "analyzed the project from the workspace evidence."}'
        - "analyzed the project from the workspace evidence."
      judge: [5, 6, 7, 8, 4]
    tools:
      list_workspace: ['{"tool": "list_workspace", "entries": [{"path": "docs", "kind": "directory"}], "truncated": false}']
      search_workspace: ['{"tool": "search_workspace", "matches": [{"path": "docs/reference/architecture.md", "line": 1, "text": "# Interpreter architecture"}], "truncated": false}']
      read_workspace_file: ['{"tool": "read_workspace_file", "path": "docs/reference/architecture.md", "content": "# Interpreter architecture", "bytes": 27, "truncated": false}']
    expect:
      status: done
      result: "analyzed the project from the workspace evidence."
      trace:
        - { state: decide, policy: ok, to: workspace_scan }
        - { state: workspace_scan, policy: ok, to: decide }
        - { state: decide, policy: ok, to: workspace_search }
        - { state: workspace_search, policy: ok, to: decide }
        - { state: decide, policy: ok, to: workspace_read }
        - { state: workspace_read, policy: ok, to: decide }
        - { state: decide, policy: ok, to: analyze_workspace }
        - { state: analyze_workspace, policy: ok, to: decide }
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # Direct answer: no tool needed — decide chooses REPLY (judge 4), reply ends.
  - name: direct-reply
    llm:
      produce:
        "single next action": '{"say": "This is arithmetic I can answer directly.", "action": "REPLY", "detail": "2+2 is 4."}'
        "final reply": "4."
      judge: [4]
    expect:
      status: done
      result: "4."
      context:
        thought:
          say: "This is arithmetic I can answer directly."
          action: "REPLY"
          detail: "2+2 is 4."
      trace:
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # The commissioning loop: decide RUN (judge 1) carries the run request in
  # `detail` → do_run's scripted observation → decide REPLY (judge 4) → reply.
  # The request reaches run_machine as a decoded object, not as JSON text.
  - name: run-then-reply
    llm:
      produce:
        "single next action": '{"say": "Commissioning std_cot for the arithmetic.", "action": "RUN", "detail": {"target": "std_cot", "inputs": {"task": "17*23"}}}'
        "final reply": "std_cot says 391."
      judge: [1, 4]
    tools:
      run_machine: ['{"status": "done", "result": "391"}']
    expect:
      status: done
      result: "std_cot says 391."
      context:
        thought:
          say: "Commissioning std_cot for the arithmetic."
          action: "RUN"
          detail:
            target: "std_cot"
            inputs: { task: "17*23" }
        observation: ['{"status": "done", "result": "391"}']
      trace:
        - { state: decide, policy: ok, to: do_run }
        - { state: do_run, policy: ok, to: decide }
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # Clarification: decide CLARIFY (judge 2) — `detail` is the question text
  # handed to the human — ask_user's scripted reply lands in the observations.
  - name: clarify-then-reply
    llm:
      produce:
        "single next action": '{"say": "I need the target environment.", "action": "CLARIFY", "detail": "which environment, staging or prod?"}'
        "final reply": "Done for staging."
      judge: [2, 4]
    tools:
      ask_user: ["staging"]
    expect:
      status: done
      result: "Done for staging."
      context:
        observation: ["staging"]
      trace:
        - { state: decide, policy: ok, to: clarify }
        - { state: clarify, policy: ok, to: decide }
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # Discovery: decide DISCOVER (judge 0) → scripted catalog → decide REPLY.
  - name: discover-then-reply
    llm:
      produce:
        "single next action": '{"say": "I need the catalog first.", "action": "DISCOVER", "detail": {}}'
        "final reply": "You have 8 stdlib machines available."
      judge: [0, 4]
    tools:
      list_machines: ['{"machines": [{"name": "std_cot"}]}']
    expect:
      status: done
      result: "You have 8 stdlib machines available."
      trace:
        - { state: decide, policy: ok, to: discover }
        - { state: discover, policy: ok, to: decide }
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # The task ledger: decide TASK_UPDATE (judge 9) writes the ledger object
  # straight from `detail`, then replies. This path used to cost two calls.
  - name: task-update-then-reply
    llm:
      produce:
        - '{"say": "Recording the goal before starting.", "action": "TASK_UPDATE", "detail": {"goal": "audit the repo", "phase": "scan"}}'
        - '{"say": "The ledger is current; answering now.", "action": "REPLY", "detail": "goal recorded."}'
        - "Recorded the goal: audit the repo."
      judge: [9, 4]
    tools:
      update_task: ['{"tool": "update_task", "saved": true}']
    expect:
      status: done
      result: "Recorded the goal: audit the repo."
      trace:
        - { state: decide, policy: ok, to: task_update }
        - { state: task_update, policy: ok, to: decide }
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # Authoring: decide AUTHOR (judge 3) — `detail` is the requirements text —
  # author emits the source → save's scripted verdict is clean → decide RUN of
  # the newborn (judge 1) → decide REPLY (judge 4). LIST-form produce: one text
  # per generative visit.
  - name: author-run-reply
    llm:
      produce:
        - '{"say": "Nothing in the catalog writes haiku; authoring one.", "action": "AUTHOR", "detail": "a haiku machine — one generative state, topic in, haiku out."}'
        - "machine: haiku\nentry: compose\nbudget: 3\n..."
        - '{"say": "Running the machine I just saved.", "action": "RUN", "detail": {"target": "haiku", "inputs": {"topic": "sea"}}}'
        - '{"say": "The haiku is back; reporting it.", "action": "REPLY", "detail": "authored and ran the haiku machine."}'
        - "Created haiku.mkl and ran it: 'old silent sea...'"
      judge: [3, 1, 4]
    tools:
      write_machine: ['{"written": "haiku.mkl", "check": {"ok": true, "errors": []}}']
      run_machine: ['{"status": "done", "result": "old silent sea..."}']
    expect:
      status: done
      result: "Created haiku.mkl and ran it: 'old silent sea...'"
      trace:
        - { state: decide, policy: ok, to: author }
        - { state: author, policy: ok, to: save }
        - { state: save, policy: ok, to: decide }
        - { state: decide, policy: ok, to: do_run }
        - { state: do_run, policy: ok, to: decide }
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # Authoring repair: the first source fails validation (verdict in the
  # observation), decide chooses AUTHOR again (judge 3), the second source is
  # clean, then REPLY. The repair happens through the decide loop — no extra
  # states needed.
  - name: author-fails-then-repairs
    llm:
      produce:
        - '{"say": "No summarizer exists; authoring one.", "action": "AUTHOR", "detail": "a summarizer machine."}'
        - "machine: summarizer\nentry: gone\n..."
        - '{"say": "The check rejected it; authoring the fix.", "action": "AUTHOR", "detail": "fix the entry state — it must exist in states."}'
        - "machine: summarizer\nentry: s\n..."
        - '{"say": "The second source validates; reporting.", "action": "REPLY", "detail": "authored the summarizer after one fix."}'
        - "summarizer.mkl is saved and valid (one validation round-trip)."
      judge: [3, 3, 4]
    tools:
      write_machine:
        - '{"written": "summarizer.mkl", "check": {"ok": false, "errors": ["entry ''gone'' is not a state"]}}'
        - '{"written": "summarizer.mkl", "check": {"ok": true, "errors": []}}'
    expect:
      status: done
      result: "summarizer.mkl is saved and valid (one validation round-trip)."
      trace:
        - { state: decide, policy: ok, to: author }
        - { state: author, policy: ok, to: save }
        - { state: save, policy: ok, to: decide }
        - { state: decide, policy: ok, to: author }
        - { state: author, policy: ok, to: save }
        - { state: save, policy: ok, to: decide }
        - { state: decide, policy: ok, to: reply }
        - { state: reply, policy: ok, to: END }

  # The price of the collapse, pinned rather than discovered in production: a
  # decision that is not a JSON document halts the state (ADR 0034) instead of
  # routing to decision_repair, which is where a malformed PROSE decision used
  # to go. The turn ends in an error the console reports; the session survives.
  - name: malformed-decision-halts
    llm:
      produce:
        "single next action": "RUN: std_cot with task '17*23'"
      judge: []
    expect:
      status: halt
      at: decide
      error_prefix: "state-error: parse-json"
