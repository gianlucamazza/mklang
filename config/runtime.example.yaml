# yaml-language-server: $schema=./runtime.schema.json
#
# mklang runtime configuration — HOST-SIDE, and deliberately NOT part of any .mkl.
# It maps the language's provider-neutral capability tiers (fast / balanced /
# reasoning, see SPEC.md §2.1) to concrete provider models. Swap `active` (or the
# tier maps) and the SAME .mkl runs on a different backend with zero edits.
#
# Model IDs below are current as of 2026-07-24. Anthropic IDs are authoritative;
# the others are the current best-in-class per provider and are host-updatable —
# verify against each provider's catalog before production.
#
# Default `active` is DeepSeek: OpenAI-compatible, cheap for smoke/live tests, and
# the path historically used to validate the reference interpreter end-to-end.
# Swap to anthropic | openai | … (or pass --provider) without editing any .mkl.

active: deepseek # deepseek | hetzner | anthropic | openai | google | openrouter | xai | mistral | local

# NOTE: every non-Anthropic provider below declares the OpenAI-compatible protocol,
# so one shared transport adapter serves them with explicit provider profiles.
# OpenRouter is a meta-provider — its `vendor/model` ids let each tier target a
# different vendor.
#
# JUDGE MODEL: by default a state's gates are judged by the SAME tier that generated
# it (SPEC §2.1) — so a `reasoning` state's high-stakes gates are judged by the
# reasoning model, not silently downgraded. The optional `judge:` key below is an
# opt-in GLOBAL override that forces ONE model for ALL gate judging (a cost/latency
# optimization that trades judging quality on your hardest gates). It is left
# commented out so the default is tier-following; uncomment only if you accept that
# trade-off.

providers:
  # --- Anthropic -----------------------------------------------------------
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    tiers:
      fast: claude-haiku-4-5 # cheapest/fastest ($1/$5 per Mtok)
      balanced: claude-sonnet-5 # near-Opus quality at Sonnet cost ($3/$15)
      reasoning: claude-opus-4-8 # strongest Opus-tier ($5/$25); swap to claude-fable-5 for the max tier
    # judge: claude-haiku-4-5 # opt-in: force ALL gate judging onto one model (default: follow each state's tier)
    params:
    # Latest-model features. Opus 4.8 / Sonnet 5: adaptive thinking + effort
      # (budget_tokens is removed on these models — do NOT use it).
      reasoning:
        thinking: adaptive
        effort: high # low | medium | high | xhigh | max (xhigh best for agentic)
        # task_budget: 64000   # optional (beta): self-pacing token budget for agentic states
      balanced:
        thinking: adaptive
        effort: medium
      fast:
        thinking: disabled # Haiku 4.5 does not support `effort` — omit it here

  # --- OpenAI --------------------------------------------------------------
  # Live-validated 2026-08-04: each model below answered a real chat.completions
  # call (with reasoning_effort) on this account. GPT-5.6 is GA since 2026-07-09 —
  # luna (fast; -80% price since 07-30), terra (balanced), sol (strongest).
  # Pro variants of earlier series are Responses-API only — the reference adapter
  # uses chat.completions, so they are not mapped here.
  openai:
    protocol: openai_compat
    api_key_env: OPENAI_API_KEY
    tiers:
      fast: gpt-5.6-luna
      balanced: gpt-5.6-terra
      reasoning: gpt-5.6-sol
    # judge: gpt-5.6-luna # opt-in: force ALL gate judging onto one model (default: follow each state's tier)
    params:
      # max_tokens defaults to 4096 on OpenAI-compat when omitted (ADR 0018).
      reasoning:
        reasoning_effort: high # minimal | low | medium | high
        # max_tokens: 8192
      balanced:
        reasoning_effort: medium

  # --- Google --------------------------------------------------------------
  google:
    protocol: openai_compat
    api_key_env: GEMINI_API_KEY
    tiers:
      fast: gemini-3-flash
      balanced: gemini-3-pro
      reasoning: gemini-3-pro
    # judge: gemini-3-flash # opt-in: force ALL gate judging onto one model (default: follow each state's tier)
    params:
      reasoning:
        thinking_level: high # Gemini 3 dynamic thinking control

  # --- DeepSeek ------------------------------------------------------------
  # OpenAI-compatible API. V4 uses one model family with an explicit thinking
  # toggle; the legacy `deepseek-chat` and `deepseek-reasoner` aliases are retired.
  deepseek:
    protocol: openai_compat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    tiers:
      fast: deepseek-v4-flash
      balanced: deepseek-v4-flash
      reasoning: deepseek-v4-flash
    params:
      fast:
        thinking: {type: disabled}
      balanced:
        thinking: {type: disabled}
      reasoning:
        thinking: {type: enabled}
        reasoning_effort: high
    # judge: deepseek-v4-flash # opt-in: force ALL gate judging onto one model (default: follow each state's tier)

  # --- Hetzner Experiments Inference --------------------------------------
  # Experimental OpenAI-compatible API. Verify the live model catalog before
  # use: the platform may change models, limits or availability without SLA.
  # https://experiments.hetzner.com/docs/inference
  hetzner:
    protocol: openai_compat
    base_url: https://inference.hetzner.com/api/v1
    api_key_env: HETZNER_INFERENCE_API_KEY
    # Optional alternative to .env: one line, mode 0600, outside the repository.
    # api_key_file: ~/.config/hetzner/inference.token
    tiers:
      fast: Qwen/Qwen3.6-35B-A3B-FP8
      balanced: Qwen/Qwen3.6-35B-A3B-FP8
      reasoning: Qwen/Qwen3.6-35B-A3B-FP8

  # --- OpenRouter (meta-provider / aggregator) -----------------------------
  # One endpoint, hundreds of models across every vendor. Model ids are
  # namespaced `vendor/model`, so each tier can point at a DIFFERENT underlying
  # provider — pick the best model per tier regardless of who makes it.
  openrouter:
    protocol: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    tiers:
      fast: google/gemini-3-flash
      balanced: anthropic/claude-sonnet-5
      reasoning: openai/gpt-5.6-sol # listed on OpenRouter's catalog 2026-08-04
    # judge: openai/gpt-5.6-luna # opt-in: force ALL gate judging onto one model (default: follow each state's tier)

  # --- xAI (Grok) ----------------------------------------------------------
  xai:
    protocol: openai_compat
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    tiers:
      fast: grok-4-fast
      balanced: grok-4
      reasoning: grok-4-heavy
    # judge: grok-4-fast # opt-in: force ALL gate judging onto one model (default: follow each state's tier)
    params:
      reasoning:
        reasoning_effort: high

  # --- Mistral -------------------------------------------------------------
  mistral:
    protocol: openai_compat
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    tiers:
      fast: mistral-small-latest
      balanced: mistral-large-latest
      reasoning: magistral-medium-latest # Mistral's reasoning model
    # judge: mistral-small-latest # opt-in: force ALL gate judging onto one model (default: follow each state's tier)

  # --- Local (OpenAI-compatible endpoint: Ollama / vLLM / LM Studio) --------
  local:
    protocol: openai_compat
    base_url: http://localhost:11434/v1
    api_key_env: LOCAL_API_KEY # often unused for local servers; keep for compatibility
    tiers:
      fast: qwen3:8b
      balanced: qwen3:32b
      reasoning: deepseek-r1:70b # a reasoning-tuned local model
    # judge: qwen3:8b # opt-in: force ALL gate judging onto one model (default: follow each state's tier)

# --- Tool backends (optional; ADR 0016) -------------------------------------
# Declarative bindings for the builtin host tools. Precedence per knob:
# explicit MKLANG_* env var > this block > built-in default. Secrets never
# live here: TAVILY_API_KEY stays in the layered .env (ADR 0023).
# tools:
#   search:
#     backend: tavily # stub | fake | tavily (stub here beats the TAVILY_API_KEY auto-select)
#   kb:
#     backend: stub # stub | fake
#   mail:
#     backend: stub # stub | fake
#   fs:
#     backend: local # stub | local (real disk under the workspace, ADR 0024)
#     workspace: ./data # default: MKLANG_FS_ROOT or the process cwd
#     write: false # standing write grant; --allow-write / MKLANG_FS_WRITE beat it
