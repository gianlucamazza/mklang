# Reusable quality gate: lint, type check, schema validation, scenario tests,
# build, and the offline pytest matrix. Called by ci.yml (every push/PR) and
# release.yml (pinned to the release tag) so both paths run identical checks.
name: quality

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (empty = the triggering ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Lint
        run: uv run --extra dev ruff check src tests scripts
      - name: Format check
        run: uv run --extra dev ruff format --check src tests scripts
      - name: Type check
        run: uv run --all-extras mypy
      - name: Dependency audit
        # Fail the gate on known vulns in the resolved env (runtime + dev extras).
        # Document any unavoidable transitive CVE with --ignore-vuln and a comment.
        run: uv run --extra dev --with pip-audit pip-audit
      - name: Reject stale or modified demo assets
        run: uv run python scripts/demo_assets.py check-drift
      - name: Validate example machines against the schema
        run: >
          uv run --with check-jsonschema
          check-jsonschema --default-filetype yaml
          --schemafile schema/mklang.schema.json examples/*.mkl machines/*.mkl
      - name: Validate the runtime config against its schema
        run: >
          uv run --with check-jsonschema
          check-jsonschema --default-filetype yaml
          --schemafile config/runtime.schema.json config/runtime.example.yaml
      - name: Semantic check + static analysis on examples, stdlib, and init sample
        run: |
          uv run mklang check examples/*.mkl machines/*.mkl src/mklang/data/stdlib/*.mkl src/mklang/data/init/*.mkl
          uv run mklang lint --strict examples/*.mkl machines/*.mkl src/mklang/data/stdlib/*.mkl src/mklang/data/init/*.mkl
      - name: Deterministic scenario tests (scripted LLM — no API keys)
        run: |
          uv run mklang test examples/triage.mkl --script examples/triage.test.yaml
          uv run mklang test src/mklang/data/init/hello.mkl --script src/mklang/data/init/hello.test.yaml
      - name: Shellcheck the install script
        run: shellcheck scripts/install.sh
      - name: Build sdist + wheel
        run: uv build
      - name: Offline suite against the sdist (AUR check surface)
        # packaging/arch/PKGBUILD check() runs pytest on the extracted PyPI
        # sdist. packaging/ and .git are excluded from the sdist; repo-hygiene
        # tests must skip there rather than FileNotFoundError. A green
        # full-checkout suite alone does not prove this path (1.0.10/1.0.11).
        run: |
          set -euo pipefail
          sdist=$(echo dist/mklang-*.tar.gz)
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar xzf "$sdist" -C "$work"
          tree=$(echo "$work"/mklang-*)
          uv venv "$work/venv"
          # Runtime deps from the sdist + AUR checkdepends equivalents.
          uv pip install --python "$work/venv/bin/python" "$sdist" pytest "mcp>=2"
          cd "$tree"
          "$work/venv/bin/python" -m pytest tests -q

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # pull tags so the tag/CHANGELOG invariant is enforced
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
      # The coverage gate ([tool.coverage.report] fail_under) fires only on the
      # canonical leg; instrumenting every leg adds runtime for no extra signal,
      # and platform-specific skips would shift the number. The console ships
      # in the core dependencies since 0.15.0 — no extra needed.
      - name: Unit tests (MockLLM — no network, incl. MCP + console surface)
        run: >
          uv run --extra dev --extra mcp pytest -q
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python == '3.13')
              && '--cov=mklang --cov-report=term-missing' || '' }}
