name: Demo assets

on:
  workflow_dispatch:
    inputs:
      force:
        description: Render even when nothing is stale
        type: boolean
        default: false
  # Monthly, because the recordings are dated artifacts rather than derived ones: what
  # `check-drift` stopped asserting (that they match the current sources) is replaced by
  # a weaker claim this schedule can actually keep — they are no older than
  # MAX_AGE_DAYS, and a moved source gets picked up within the month. Runs cost live
  # provider calls, so the job checks whether anything is stale before spending them.
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: demo-assets
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRANCH: automation/demo-assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Decide whether anything needs rendering
        id: staleness
        # Before the toolchain install and before any live call. `staleness` exits 1 when
        # a source moved or the recordings are past MAX_AGE_DAYS, which is the only
        # reason to spend DeepSeek and Tavily calls on a schedule. A manual dispatch can
        # override it — that is what `force` is for.
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Forced by dispatch input."
            exit 0
          fi
          if uv run python scripts/demo_assets.py staleness; then
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Nothing stale: no sources moved and the recordings are within MAX_AGE_DAYS."
          else
            echo "render=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned VHS, font, and media tools
        if: steps.staleness.outputs.render == 'true'
        run: |
          set -a
          source demos/toolchain.conf
          set +a
          sudo apt-get update
          sudo apt-get install --yes ffmpeg ttyd unzip
          vhs_archive="$RUNNER_TEMP/vhs.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            --output "$vhs_archive"
          echo "$VHS_ARCHIVE_SHA256  $vhs_archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vhs/bin"
          tar -xzf "$vhs_archive" --strip-components=1 -C "$RUNNER_TEMP/vhs/bin" \
            "vhs_${VHS_VERSION}_Linux_x86_64/vhs"
          echo "$RUNNER_TEMP/vhs/bin" >> "$GITHUB_PATH"

          font_archive="$RUNNER_TEMP/JetBrainsMono.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/JetBrains/JetBrainsMono/releases/download/v${FONT_VERSION}/JetBrainsMono-${FONT_VERSION}.zip" \
            --output "$font_archive"
          echo "$FONT_ARCHIVE_SHA256  $font_archive" | sha256sum --check --strict
          font_dir="$HOME/.local/share/fonts/JetBrainsMono"
          mkdir -p "$font_dir"
          for style in Regular Bold Italic BoldItalic; do
            unzip -j -q "$font_archive" "fonts/ttf/JetBrainsMono-${style}.ttf" -d "$font_dir"
          done
          fc-cache --force "$font_dir"
          test "$(fc-match --format='%{family}' "$FONT_FAMILY")" = "$FONT_FAMILY"
      - name: Render and validate live DeepSeek demos
        if: steps.staleness.outputs.render == 'true'
        run: uv run --extra console python scripts/demo_assets.py all
      - uses: actions/upload-artifact@v7
        if: steps.staleness.outputs.render == 'true'
        with:
          name: demo-assets-preview
          path: docs/assets/demos/
          if-no-files-found: error
      - name: Push the generated asset branch
        id: push
        if: steps.staleness.outputs.render == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --force-create "$BRANCH"
          git add docs/assets/demos
          if git diff --cached --quiet; then
            echo "Demo assets are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: regenerate live demo assets"
          git push --force-with-lease origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the review PR
        if: steps.staleness.outputs.render == 'true' && steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Demo assets regenerated from the current main branch. Please repeat the visual review checklist in the PR description."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: regenerate live demo assets" \
            --body-file .github/demo-assets-pr.md
