name: requirements
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Validate requirements and references
        run: uv run --no-project --with jsonschema==4.26.0 python engineering/tools/requirements.py .
      - name: Check distribution integrity
        run: python engineering/check_distribution.py
