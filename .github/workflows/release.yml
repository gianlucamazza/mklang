name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # The same reusable gate as ci.yml (lint, mypy, schema, scenario tests, and
  # the offline pytest matrix incl. coverage), pinned to the release tag.
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  quality-and-build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(uv run python -c 'import mklang; print(mklang.__version__)')"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Build docs strictly
        run: |
          bash scripts/build-docs.sh
          uv run --extra docs mkdocs build --strict
      - name: Build and validate distributions
        env:
          # ZIP timestamps cannot precede 1980; use the earliest valid epoch
          # while keeping release artifacts reproducible.
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          uv build
          uvx twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/mklang-release-smoke
          uv pip install --python /tmp/mklang-release-smoke/bin/python dist/*.whl
          /tmp/mklang-release-smoke/bin/python -c 'import importlib.resources, mklang; assert importlib.resources.files("mklang").joinpath("data/mklang.schema.json").is_file(); print(mklang.__version__)'
          /tmp/mklang-release-smoke/bin/mklang --help
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Required DeepSeek smoke
        run: MKLANG_LIVE=1 MKLANG_LIVE_PROVIDER=deepseek uv run --all-extras pytest -q tests/test_live.py
      # Was OpenAI until 2026-09-06. Swapped because the account cannot be funded, and a
      # required smoke nobody can pay for is a release gate that fails for a reason it was
      # not built to test. OpenRouter keeps the property the pair exists for — two
      # different vendors on the `openai_compat` path — and adds one the old pair did not
      # have: it is the provider this project actually ships on. See
      # docs/experiments/gate-divergence.md, Release-gate floor policy.
      - name: Required OpenRouter smoke
        run: MKLANG_LIVE=1 MKLANG_LIVE_PROVIDER=openrouter uv run --all-extras pytest -q tests/test_live.py
      - name: Cross-provider gate agreement
        # Floor policy (do not edit floors without updating the table in
        # docs/experiments/gate-divergence.md — Release-gate floor policy):
        # - gate_divergence: anchor multi-way ok routing → min-agreement 1.0
        # - severity_escalate: contestability probe → per-machine floor 0.5
        #   (observed 0.667 on 2026-07-24; blocks total chaos, not probes)
        # - --require-providers deepseek,openrouter; others skip if key absent.
        #   OpenAI stays in --providers: it is still measured and reported, it is simply
        #   no longer allowed to block a release by running out of credit.
        # Promoting machines: see gate-divergence.md "Promoting a machine".
        run: |
          mkdir -p live-results
          uv run --all-extras python scripts/gate_divergence.py \
            --machines gate_divergence,severity_escalate \
            --providers deepseek,openai,anthropic,google,openrouter,xai,mistral \
            --repeats 3 \
            --require-providers deepseek,openrouter \
            --min-agreement 1.0 \
            --min-agreement-by-machine severity_escalate=0.5 \
            --jsonl live-results/runs.jsonl \
            --summary-json live-results/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-provider-report
          path: live-results/
          if-no-files-found: warn

  publish:
    needs: [quality, quality-and-build, live-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
