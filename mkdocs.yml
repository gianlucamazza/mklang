site_name: mklang
site_description: A declarative language for LLM-driven state machines.
# The apex is the platform that runs these machines; this site is the language's own
# name. It matters beyond tidiness: mkdocs derives every page's canonical link and the
# whole sitemap from this value, so an apex here tells a crawler that /SPEC/ lives at
# mklang.dev/SPEC/ — which is a 404.
site_url: https://docs.mklang.dev/
repo_url: https://github.com/gianlucamazza/mklang
repo_name: gianlucamazza/mklang
docs_dir: site-src # generated — run scripts/build-docs.sh first

theme:
  name: material
  # font: false keeps the build free of Google Fonts requests — the platform
  # site ships no webfont and no third-party origin (ADR 0018), and the docs
  # hold the same posture: system stacks come from the vendored tokens.
  font: false
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    # Dark first and unconditioned: the brand scheme is the default for
    # everyone (mklang.dev is dark-only); light stays one toggle away.
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
  features:
    - navigation.sections
    - content.code.copy

extra_css:
  - assets/stylesheets/tokens.css # vendored from mklang-platform/web/shared/
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Language:
      - Specification: SPEC.md
      - Cheatsheet: cheatsheet.md
      - Conformance: conformance.md
  - Guides:
      - Getting started: getting-started.md
      - Installation: install.md
      - Authoring guide: authoring.md
      - Best practices: best-practices.md
      - Host embedding: host-embedding.md
      - Stability policy: stability.md
      - Patterns: patterns.md
      - Console: console.md
      - Live demos: demos.md
  - Reference:
      - CLI: cli.md
      - Machine stdlib: stdlib.md
      - Host tools: tools.md
  - Project:
      - Roadmap: ROADMAP.md
      - Changelog: CHANGELOG.md
  # Contributor-facing pages live together, apart from the user guides.
  # docs/experiments/ (internal research notes) is not published at all —
  # build-docs.sh rewrites links to it into GitHub URLs.
  - Development:
      - Contributing: CONTRIBUTING.md
      - Interpreter architecture: architecture.md
      # Individual ADRs stay published at /adr/NNNN-*/ but out of the nav:
      # the index table is the entry point, so the sidebar doesn't grow with
      # every new decision.
      - Decisions (ADRs): adr/README.md
  # Mirrors the site's "The language" masthead link back at the product.
  # The label is the full designation on purpose — ADR 0019 (platform repo):
  # bare "mklang" names the Apache-2.0 language, never the paid host.
  - mklang platform: https://mklang.dev/
