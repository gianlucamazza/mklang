case: flow-taint-hook-confirms
description: A `hook:` gate is the confirmation the rule asks for — the transition it selects is host-decided, so the effect proceeds under the halt policy.
machine:
  machine: ftc
  entry: read
  budget: 6
  context:
    request: ""
  hooks:
    - name: approved
      description: True when the host approves writing.
  states:
    read:
      structure: s
      prompt: "Handle this request: {{request}}"
      output: plan
      gates:
        - { when: the host approves the write, hook: approved, then: ok, to: write }
        - { when: otherwise, then: ok, to: END }
    write:
      tool: write_file
      input: { path: "out.txt", content: "{{plan}}" }
      output: written
      gates: [{ when: otherwise, then: ok, to: END }]
input:
  request: "please write the notes to disk"
llm:
  produce: ["write the file"]
hooks:
  approved: [true]
tools:
  write_file: ['{"tool": "write_file", "written": true}']
run:
  on_untrusted_flow: halt
expect:
  status: done
  trace:
    - { state: read, gate_via: hook, policy: ok, to: write }
    - { state: write, policy: ok, to: END }
